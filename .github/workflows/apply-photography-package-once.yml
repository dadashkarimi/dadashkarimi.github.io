name: Prepare approved photography covers
on:
  push:
    branches: [photography-albums-publish-20260924]
    paths: ['.github/workflows/apply-photography-package-once.yml']
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: photography-albums-publish-20260924
      - run: python3 -m pip install pillow
      - name: Download preview images and verify every pixel against approved covers
        run: |
          python3 - <<'PY'
          import io, hashlib, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image
          covers = [
              ('big-house','f6d3e1fd34cc00998b33a92d913c41d7c8710109454fc5160258e968feb0d2d5','https://lh7-rt.googleusercontent.com/slidesz/AGV_vUc9ZapPu-lsqLc7Q_NFXi-gkzsXK5lC5o3Sg9ZJ02wYtGLsVBZ_TNj_I44kSwKGBjQsCKiHRS-IjrVuZpiE4pbXvX0REVOirMlzhggsvplF5WOksL1mj32r6dMKpD1L94lsKnBCzaESIJxJsAGMAqtcZ9_BDMyZzp6Tst56-0xB5GQvT80=s2048?key=Bz0ywEq4vdq1uWTxSlAKRw'),
              ('valley-forge','d68d3044321c632f877efbbdf8ee8420095bd323aaed72a660f2e8b38650d0be','https://lh7-rt.googleusercontent.com/slidesz/AGV_vUf-ExMkuOtxDOT0SpplZ0KU8JxwiOsC1YLSF7nHnqqyu-Lqyvv5PhulsxrkEAuSJTTdvrQF3rRhOCQc2BhZx2xi8k06mQKmiq8M8oEnXj_RrS5xZDiuMNAblNJgHaCnZXEFmaXz7tThcSzthINBQS2Ruz7jtHBS6YnpJWC-5fBjrMwu=s2048?key=Bz0ywEq4vdq1uWTxSlAKRw'),
              ('national-capitol-columns','f1adbf91ece8ae09c92e7c3b7ddba42ee202272e1aab865a073d982c91259c98','https://lh7-rt.googleusercontent.com/slidesz/AGV_vUc_xn4s2onTN2KV7y4roDogNoVUcNzcR2kVokY0tiv_aFhiYbU_ObfWbl5OodpbNfdOfLtUXBuVLQaEeN_8yfFcKLwN-iXSGrW3UC6UpHJ-6silmzNu3IrAocU76rqBlCWlHatH5F8Je4mcwckH5wr273KVtuHVVWhg3sTJhnmHHiYNeRQ=s2048?key=Bz0ywEq4vdq1uWTxSlAKRw'),
              ('hopewell-lake','6200c9590357a39e89b580991f70e3e4fd830bda81c800edf97ccdd3d626089b','https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfFD6DJCmvmm6QPwM4MNTiqNuyGCrD14BzdN8Q64qdsk3M-QZXw33LXJ-Aq8DsjWumQeHDN0wayl1HU-zGazPpD8oki4WdY_2OHmI-mjCFvaq1qNEka_y24PVwxO7cz5R6NDZjYdiQKp5e_0FrVWFMzgRMWcNMKsQB2CqUkTzkLtIB-hVg=s2048?key=Bz0ywEq4vdq1uWTxSlAKRw'),
              ('hopewell-furnace','02c5f3337a576838b46c5a1ee9e6737254573cf2f02343602b0ba374e29daf64','https://lh7-rt.googleusercontent.com/slidesz/AGV_vUf6yY6P63pu2sj8Q73IGY59OmuohMr008_9CaV6R_6n7XiEqVpiZhO5X-UVuQwQIUKNSaBZfANmWrwzfNPXLNI5-sk1j_GN7lccyf7WWhmTzWgfFHimu9dUPLV1GoZd7i3sxmErUBlYF43azVkQoT-ilMDGgokCgrJQHH2mgqfgT-A6gG4=s2048?key=Bz0ywEq4vdq1uWTxSlAKRw')
          ]
          out=Path('images/photography'); out.mkdir(parents=True,exist_ok=True)
          for name,expected,url in covers:
              with urllib.request.urlopen(url,timeout=60) as response:
                  image=Image.open(io.BytesIO(response.read(5_000_000))).convert('RGB')
              assert image.size == (604,403), 'Unexpected dimensions for '+name
              assert hashlib.sha256(image.tobytes()).hexdigest()==expected, 'Image pixels changed for '+name
              image.save(out/(name+'.webp'),format='WEBP',lossless=True,method=6)
              print('Verified:',name)
          subprocess.run(['git','add','--','images/photography'],check=True)
          PY
      - name: Save approved cover previews on staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add the five verified low-resolution photography album covers'
          git push origin HEAD:refs/heads/photography-albums-publish-20260924
          echo "PHOTOGRAPHY_COVERS_COMMIT=$(git rev-parse HEAD)"
