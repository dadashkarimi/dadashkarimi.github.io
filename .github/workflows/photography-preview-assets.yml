name: Photography preview assets
on:
  push:
    branches: [photography-pixieset-integration]
    paths: ['.github/workflows/photography-preview-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package existing site source without modifying it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          with zipfile.ZipFile('photography-site-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  p=Path(name)
                  if p.suffix in {'.html','.css'} or (name.startswith('js/') and p.suffix=='.js') or name.startswith('icons/') or name=='images/favicon.png':
                      if p.is_file(): z.write(p,name)
              z.writestr('source-commit.txt',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          print('Prepared photography-site-source.zip:',Path('photography-site-source.zip').stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: photography-site-source
          path: photography-site-source.zip
          retention-days: 3
          if-no-files-found: error
