name: Prepare BITTS talk photos once
on:
  push:
    branches: [pigment-bitts-yale-talk-20260924]
    paths: ['.github/workflows/bitts-photos-once.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: pigment-bitts-yale-talk-20260924
      - run: python3 -m pip install pillow
      - name: Verify the two supplied photographs and save web copies
        run: |
          python3 - <<'PY'
          import io, hashlib, urllib.request
          from pathlib import Path
          from PIL import Image
          photos = [
            ('pigment-bitts-yale-presenter', '16cdcce6e410d8df240b3b510be10288c987434c82c2a9d1a422a3e05c7900c5', 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUc8qXw-noeJFk1j7oV8YxpcRRvXA0BsNNfFDxnSQtsDRaUbae-cNyilYUNoqPM0UfKWDzwAn3V9gTGp1JT35FE5mmKxKLMyEFX-HkWqa_OQ2Fmk2-TXLAONk5zZGByaKaFwoSQSBo-1av4Wpg4kOiuDE7T9okggeGZakCorF2n6viBZgxc=s2048?key=tzEp-4FiH7oF5TzdJXYm8w'),
            ('pigment-bitts-yale-audience', 'db4dac70a5b5364279990bd2465e2229444b1ac53cc9c1024995aa8a38fa5c0b', 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUcAKmNLktsNlJ2ppJtq-akzFD5OScudIbdrleKIPnN4WMFCX6sxYylkM5ttaIBLUO8MCm0Fg9xx5CHIariO33bXbqSfQvU3DiV5r8czge8kMZJublcmCCQgaeRI2Ak8lgQvPvwnyC3eDnEaOI_fTYEVc9PrBt0g_yXNEpmPj_r6M88JFDY=s2048?key=tzEp-4FiH7oF5TzdJXYm8w')
          ]
          out = Path('images/talks'); out.mkdir(parents=True, exist_ok=True)
          for name, expected, url in photos:
              dest = out / (name + '.jpg')
              if dest.exists(): raise RuntimeError('Refusing to overwrite an existing photo: ' + name)
              with urllib.request.urlopen(url, timeout=60) as response:
                  raw = response.read(12_000_001)
              if len(raw) > 12_000_000: raise RuntimeError('Image exceeds size limit')
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              if image.size != (2048, 1536): raise RuntimeError('Unexpected dimensions: ' + name)
              if hashlib.sha256(image.tobytes()).hexdigest() != expected:
                  raise RuntimeError('The transferred photo differs from the supplied original: ' + name)
              image.save(dest, 'JPEG', quality=90, progressive=True, optimize=True, subsampling=0)
              print('Verified original pixels; wrote', dest, image.size)
          PY
      - name: Save the verified photographs and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- images/talks/pigment-bitts-yale-presenter.jpg images/talks/pigment-bitts-yale-audience.jpg
          git rm -- .github/workflows/bitts-photos-once.yml
          git commit -m 'Add the two verified PIGMENT BITTS presentation photos'
          git push origin HEAD:refs/heads/pigment-bitts-yale-talk-20260924
          echo "Verified photo commit: $(git rev-parse HEAD)"
